name: Deploy survey

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        shell: bash
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_APPS_SCRIPT_URL}" ]; then
            echo "GOOGLE_APPS_SCRIPT_URL is not set"
            exit 1
          fi
          mkdir -p dist
          cp index.html styles.css script.js logo.svg dist/
          sed "s|__GOOGLE_APPS_SCRIPT_URL__|${GOOGLE_APPS_SCRIPT_URL}|g" config.js > dist/config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
